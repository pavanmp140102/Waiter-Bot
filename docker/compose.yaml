# Services for building, testing and running Waiter-Bot (see docs/plan/M8_docker.md).
x-common: &common
  environment:
    ROS_DOMAIN_ID: "42"

x-runtime-build: &runtime-build
  context: ..
  dockerfile: docker/Dockerfile
  target: runtime

services:
  # Runs the fast tests (static checks, task logic, node tests) one package at a time, then
  # prints the results. The exit code reflects pass or fail.
  test:
    <<: *common
    build: *runtime-build
    image: waiter-bot:runtime
    command: >
      bash -c "colcon test --executor sequential && colcon test-result --verbose"
